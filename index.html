        }

        }
        body * {
          visibility: hidden;
        }
        #template,
        #template * {
          visibility: visible;
        }
        #template {
          position: absolute;
          top: 0;
          left: 0;
          width: 210mm;
          min-height: 297mm;
          padding: 20mm;
          box-sizing: border-box;
        }
      }

      body {
        font-family: Arial, sans-serif;

        padding: 0;
        background: #f7f7f7;
      }
      h1 {

        font-size: 2.5em;
        color: #1e2a78;
      }

      .form-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }
      .form-group {
        margin: 15px;
        width: 300px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }

      input,
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        font-family: Arial, sans-serif;
        box-sizing: border-box;
        background-color: #fff;
      }

      .button-container {
        text-align: center;
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .button {
        background-color: #1e2a78;
        color: white;
        border: none;
        padding: 10px 25px;
        margin: 10px 8px;
        font-size: 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      .button:hover {
        background-color: #15205e;
      }

      #template {
        margin: 0;
        padding: 20px;
        width: 100vw;
        border: none;
        background-color: #fff;
        color: #000;
        box-sizing: border-box;
      }

      .header,
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      .table th {
        border: 1px solid #000;
        padding: 6px;
        font-size: 14px;
        text-align: center;
        background-color: #1e2a78;
        color: #fff;
        font-weight: bold;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .table td {
        border: 1px solid #000;
        padding: 6px;
        font-size: 14px;
        text-align: center;
      }

      .remarks {
        margin-top: 10px;
        font-size: 13px;
        color: #666;
        font-style: italic;
      }
      .small {
        font-size: 12px;
      }
      .medium-text {
        font-size: 14px;
      }

      .pretty-remarks {
        margin-top: 10px;
        font-size: 14px;
        color: #333;
        line-height: 1.5;
        list-style: disc inside;
        padding-left: 10px;
      }

      .table-wrapper {
        width: 100%;
        overflow-x: auto;
      }
      .table-wrapper::-webkit-scrollbar {
        height: 8px;
      }
      .table-wrapper::-webkit-scrollbar-thumb {
        background-color: #ccc;
        border-radius: 10px;
      }
      .table {
        width: 100%;
        min-width: 700px;
        border-collapse: collapse;
      }
      .table th,
      .table td {
        padding: 8px;
        text-align: center;
        border: 1px solid #000;
        font-size: 14px;
      }
      .table th {
        background-color: #1e2a78;
        color: #fff;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .controls-inline {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      /* Tabs for sectors */
      .tabs {
        width: 100%;
        margin: 0 auto;
      }
      .tab-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 8px 10px 12px;
        justify-content: center;
      }
      .tab-button {
        background: #e5e7eb;
        border: none;
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
        font-weight: 600;
      }
      .tab-button.active {
        background: #1e2a78;
        color: #fff;
      }
      .tab-content {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 8px 0 24px !important;
      }
      .hidden {
        display: none;
      }
      .button-container.toolbar {
        justify-content: center;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 12px 16px;
        margin: 12px auto 0;
        width: fit-content;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        gap: 16px;
      }
      .button-container.toolbar label {
        margin: 0 6px;
        font-weight: 600;
        color: #111827;
      }
      .controls-inline strong {
        font-size: 14px;
        color: #374151;
      }
      .nice-select {

        -moz-appearance: none;
        padding: 8px 36px 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-weight: 600;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6),

        background-color: #fff;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%231e2a78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 18px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .nice-select:hover {
        border-color: #94a3b8;
      }
      .nice-select:focus {
        outline: none;
        border-color: #1e2a78;
        box-shadow: 0 0 0 3px rgba(30, 42, 120, 0.15);
      }
      .controls-inline input[type="radio"] {
        accent-color: #1e2a78;
        transform: scale(1.1);
      }
      .sector-card {
        border: 1px solid #1e2a78 !important;
        border-radius: 14px !important;
        box-shadow: none !important;
        padding: 18px !important;
        margin: 10px auto 0 !important;
        max-width: 960px !important;
        margin-left: 10px auto !important;
        margin-right: 10px auto !important;
        width: min(960px, 80vw) !important;
      }
      .sector-title {
        font-size: 16px !important;
        font-weight: 800 !important;
        color: #1e2a78 !important;
      }
      .sector-grid {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 16px !important;
      }
      .sector-card .form-group {
        margin: 6px 0 !important;
      }
      .sector-card label {
        display: block !important;
        margin-bottom: 6px !important;
        font-weight: 700 !important;
        color: #111827 !important;
      }
      .sector-card input,
      .sector-card select {
        width: 100% !important;
        padding: 10px 12px !important;
        border: 1px solid #d1d5db !important;
        border-radius: 10px !important;
        font-size: 14px !important;
        background: #fff !important;
        transition: border-color 0.2s, box-shadow 0.2s !important;
      }
      .sector-card input:focus,
      .sector-card select:focus {
        outline: none !important;
        border-color: #1e2a78 !important;
        box-shadow: 0 0 0 3px rgba(30, 42, 120, 0.15) !important;
      }
      .sector-card .sector-title {
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .sector-title-row {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        vertical-align: middle;
      }

      .delete-btn {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        line-height: 1;
        display: inline-flex;
        align-items: center;
      }

      .delete-btn svg {
        width: 16px;
        height: 16px;
        fill: #c00;
        transition: fill 0.2s;
      }

      .delete-btn:hover svg {
        fill: #900;
      }

      @media (max-width: 1200px) {
        .sector-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
      }
      @media (max-width: 768px) {
        .sector-grid {
          grid-template-columns: 1fr !important;
        }
        .sector-card .form-group {
          max-width: 420px;
          margin-left: auto !important;
          margin-right: auto !important;
        }
        .sector-card .sector-title-row {
          display: flex;
          width: 100%;
          justify-content: center;
        }
      }
      @media (max-width: 480px) {
        .button-container.toolbar {
          box-sizing: border-box;
          width: min(720px, calc(100vw - 32px));
          margin-left: auto;
          margin-right: auto;
        }
      }

  <body>
    <h1>Huffaz Holiday</h1>

    <div class="button-container toolbar">
      <label class="controls-inline">
        <input
          type="radio"
          name="mode"
          value="voucher"
          checked
          onchange="switchMode(this.value)"
        />
        Voucher
      </label>
      <label class="controls-inline">
        <input
          type="radio"
          name="mode"
          value="invoice"
          onchange="switchMode(this.value)"
        />
        Invoice
      </label>

      <div class="controls-inline">
        <label for="sectorsCount"><strong>Sectors:</strong></label>
        <select
          id="sectorsCount"
          class="nice-select"
          onchange="resizeSectorsTo(this.value)"
        >
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>

      <button class="button" onclick="addSector()">Add Sector</button>
    </div>

    <!-- General (shared) fields -->
    <div class="form-container" id="generalForm"></div>

    <!-- Sector fields (repeatable) -->
    <div
      id="sectorsContainer"
      class="form-container"
      style="justify-content: center"
    ></div>

    <div class="button-container">
      <button class="button" onclick="generateTemplate()">
        Generate Document
      </button>
      <button class="button" onclick="handlePrint()">Print</button>
      <!-- <button class="button" onclick="exportToPDF()">Export to PDF</button> -->
    </div>

QIECBB4EnDcn9aSlQABAgQIECBAICvguGenV5wAAQIECBAgQOBJwHF/WktWAgQIECBAgACBrIDjnp1ecQIECBAgQIAAgScBx/1pLVkJECBAgAABAgSyAo57dnrFCRAgQIAAAQIEngQc96e1ZCVAgAABAgQIEMgKOO7Z6RUnQIAAAQIECBB4EnDcn9aSlQABAgQIECBAICvguGenV5wAAQIECBAgQOBJwHF/WktWAgQIECBAgACBrIDjnp1ecQIECBAgQIAAgScBx/1pLVkJECBAgAABAgSyAo57dnrFCRAgQIAAAQIEngQc96e1ZCVAgAABAgQIEMgKOO7Z6RUnQIAAAQIECBB4EnDcn9aSlQABAgQIECBAICvguGenV5wAAQIECBAgQOBJwHF/WktWAgQIECBAgACBrIDjnp1ecQIECBAgQIAAgScBx/1pLVkJECBAgAABAgSyAo57dnrFCRAgQIAAAQIEngQc96e1ZCVAgAABAgQIEMgKOO7Z6RUnQIAAAQIECBB4EnDcn9aSlQABAgQIECBAICvguGenV5wAAQIECBAgQOBJYDrPdNb8wC6qAAAAAElFTkSuQmCC";

      // ==== State ====
      let currentMode = "voucher"; // or "invoice"
      let sectorsState = []; // [{ Qty, RoomType, CheckIn, CheckOut, Nights, ConfOrPrice, View, MealPlan }]

      // Shared (non-sector) fields
      const generalFields = [
        { key: "Date", type: "date", label: "Date" },
        { key: "ResNo", type: "text", label: "Res No" },
        { key: "To", type: "text", label: "To" },
        { key: "Att", type: "text", label: "Att" },
        { key: "HotelName", type: "text", label: "Hotel Name" },
        { key: "GuestName", type: "text", label: "Guest Name" },
        { key: "TotalPax", type: "text", label: "Total Pax" },
        { key: "Remarks", type: "text", label: "Remarks" },
      ];

      // ==== DOM helpers ====
      function el(tag, props = {}, ...children) {
        const e = document.createElement(tag);
        Object.entries(props).forEach(([k, v]) => {
          if (k === "className") e.className = v;
          else if (k === "innerHTML") e.innerHTML = v;
          else if (k === "text") e.textContent = v;
          else if (k === "attrs" && v && typeof v === "object") {
            Object.entries(v).forEach(([ak, av]) => {
              if (av !== undefined) e[ak] = av;
            });
          } else if (k in e) {
            e[k] = v;
          } else {
            e.setAttribute(k, v);
          }
        });
        children.forEach((c) => e.appendChild(c));
        return e;
      }
      function formGroup(id, labelText, inputEl) {
        const g = el("div", { className: "form-group", id });
        g.appendChild(el("label", { text: labelText, htmlFor: inputEl.id }));
        g.appendChild(inputEl);
        return g;
      }
      function createSelect(id, options) {
        const sel = el("select", { id });
        options.forEach((opt) =>
          sel.appendChild(el("option", { value: opt, text: opt }))
        );
        return sel;
      }

      // ==== General form ====
      const generalFormEl = document.getElementById("generalForm");
      function renderGeneral() {
        generalFormEl.innerHTML = "";
        generalFields.forEach((field) => {
          const group = el(
            "div",
            { className: "form-group" },
            el("label", { text: field.label, htmlFor: field.key }),
            el("input", {
              id: field.key,
              type: field.type,
              attrs: field.attrs || {},
            })
          );
          generalFormEl.appendChild(group);
        });
      }

      // ==== Sector state helpers ====
      function blankSector() {
        return {
          Qty: "1",
          RoomType: "",
          CheckIn: "",
          CheckOut: "",
          Nights: "0",
          ConfOrPrice: "",
          View: "Standard",
          MealPlan: "RO",
        };
      }
      function resizeSectorsTo(n) {
        const target = Math.max(1, Math.min(5, n | 0 || 1));
        while (sectorsState.length < target) sectorsState.push(blankSector());
        while (sectorsState.length > target) sectorsState.pop();
        renderSectorsFromState();
        const sel = document.getElementById("sectorsCount");
        if (sel) sel.value = String(sectorsState.length);
      }
      function addSector() {
        if (sectorsState.length >= 5) return;
        sectorsState.push(blankSector());
        renderSectorsFromState();
        setActiveTab(sectorsState.length);
        const sel = document.getElementById("sectorsCount");
        if (sel) sel.value = String(sectorsState.length);
      }
      function deleteSector(idx1) {
        if (sectorsState.length <= 1) return; // keep at least 1
        const i = idx1 - 1;
        sectorsState.splice(i, 1);
        renderSectorsFromState();
        setActiveTab(Math.min(idx1, sectorsState.length));
        const sel = document.getElementById("sectorsCount");
        if (sel) sel.value = String(sectorsState.length);
      }

      // ==== Sector rendering (tabs) ====
      const sectorsContainer = document.getElementById("sectorsContainer");
      function renderSectorsFromState() {
        sectorsContainer.innerHTML = "";
        const tabsWrap = el("div", { className: "tabs" });
        const btnRow = el("div", {
          className: "tab-buttons",
          id: "sectorTabButtons",
        });
        const contentArea = el("div", { id: "sectorTabContents" });

        for (let i = 1; i <= sectorsState.length; i++) {
          const b = el("button", {
            className: "tab-button",
            id: `sectorTabBtn_${i}`,
            text: `Sector ${i}`,
          });
          b.addEventListener("click", () => setActiveTab(i));
          btnRow.appendChild(b);

          const c = el("div", {
            className: "tab-content hidden",
            id: `sectorTab_${i}`,
          });
          c.appendChild(renderSectorCard(i));
          contentArea.appendChild(c);
        }

        tabsWrap.appendChild(btnRow);
        tabsWrap.appendChild(contentArea);
        sectorsContainer.appendChild(tabsWrap);
        setActiveTab(1);
      }
      function setActiveTab(idx) {
        for (let i = 1; i <= sectorsState.length; i++) {
          const btn = document.getElementById(`sectorTabBtn_${i}`);
          const pane = document.getElementById(`sectorTab_${i}`);
          if (btn && pane) {
            if (i === idx) {
              btn.classList.add("active");
              pane.classList.remove("hidden");
            } else {
              btn.classList.remove("active");
              pane.classList.add("hidden");
            }
          }
        }
      }

      function renderSectorCard(idx) {
        const s = sectorsState[idx - 1];
        const card = el("div", { className: "sector-card" });

        // Title + Delete (side-by-side)
        const titleRow = el("div", { className: "sector-title-row" });
        const titleText = el("span", {
          className: "sector-title",
          text: `Sector ${idx}`,
        });
        const delBtn = el("button", {
          className: "delete-btn",
          attrs: { title: "Delete sector" },
        });
        delBtn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
            <path d="M135.2 17.7C140.6 7.4 150.9 0 162.8 0h122.4c11.9 0 22.2 7.4 27.6 17.7L328 32H432
            c8.8 0 16 7.2 16 16s-7.2 16-16 16h-16l-21.2 403.8c-1.2 22.8-19.9 40.2-42.7
            40.2H96c-22.8 0-41.5-17.4-42.7-40.2L32 64H16C7.2 64 0 56.8 0 48s7.2-16
            16-16h104l15.2-14.3zM96 96l21 384h214l21-384H96z"/>
        </svg>
        `;
        delBtn.addEventListener("click", () => deleteSector(idx));
        titleRow.appendChild(titleText);
        titleRow.appendChild(delBtn);
        card.appendChild(titleRow);

        const grid = el("div", { className: "sector-grid" });

        // binding helper
        const bind = (prop, inputEl, afterChange) => {
          inputEl.value = s[prop] ?? "";
          inputEl.addEventListener("input", () => {
            s[prop] = inputEl.value;
            if (afterChange) afterChange();
          });
          return inputEl;
        };

        // Qty
        grid.appendChild(
          formGroup(
            `${idx}_Qty`,
            "Qty",
            bind(
              "Qty",
              el("input", {
                id: `Qty_${idx}`,
                type: "number",
                attrs: { min: 1 },
              })
            )
          )
        );
        // Room Type
        grid.appendChild(
          formGroup(
            `${idx}_RoomType`,
            "Room Type",
            bind(
              "RoomType",
              el("input", { id: `RoomType_${idx}`, type: "text" })
            )
          )
        );
        // Check In / Out / Nights
        const ci = bind(
          "CheckIn",
          el("input", { id: `CheckIn_${idx}`, type: "date" }),
          () => calcNights(idx)
        );
        const co = bind(
          "CheckOut",
          el("input", { id: `CheckOut_${idx}`, type: "date" }),
          () => calcNights(idx)
        );
        const nightsEl = el("input", {
          id: `Nights_${idx}`,
          type: "number",
          attrs: { readOnly: true, value: s.Nights || 0 },
        });
        grid.appendChild(formGroup(`${idx}_CheckIn`, "Check In", ci));
        grid.appendChild(formGroup(`${idx}_CheckOut`, "Check Out", co));
        grid.appendChild(formGroup(`${idx}_Nights`, "Nights", nightsEl));

        // Confirmation or Price per Night (depends on mode)
        const label =
          currentMode === "invoice" ? "Price per Night" : "Confirmation";
        const confOrPriceId =
          currentMode === "invoice"
            ? `PricePerNight_${idx}`
            : `Confirmation_${idx}`;
        const confOrPriceType = currentMode === "invoice" ? "number" : "text";
        const confOrPriceAttrs =
          currentMode === "invoice" ? { min: 0, step: "0.01" } : {};
        const confInput = bind(
          "ConfOrPrice",
          el("input", {
            id: confOrPriceId,
            type: confOrPriceType,
            attrs: confOrPriceAttrs,
          })
        );
        const confGroup = formGroup(`${idx}_ConfOrPrice`, label, confInput);
        confGroup.dataset.dynamic = "true";
        grid.appendChild(confGroup);

        // View
        const viewSel = createSelect(`View_${idx}`, [
          "Standard",
          "Partial Haram View (P.H.V)",
          "Partial Kaaba View (P.K.V)",
          "Haram View (H.V)",
          "Kaaba View (K.V)",
        ]);
        viewSel.value = s.View || "Standard";
        viewSel.addEventListener("change", () => (s.View = viewSel.value));
        grid.appendChild(formGroup(`${idx}_View`, "View", viewSel));

        // Meal Plan
        const mpSel = createSelect(`MealPlan_${idx}`, ["RO", "BB", "HB", "FB"]);
        mpSel.value = s.MealPlan || "RO";
        mpSel.addEventListener("change", () => (s.MealPlan = mpSel.value));
        grid.appendChild(formGroup(`${idx}_MealPlan`, "Meal Plan", mpSel));

        card.appendChild(grid);
        return card;
      }

      function calcNights(idx) {
        const s = sectorsState[idx - 1];
        const ci = new Date(s.CheckIn || "");
        const co = new Date(s.CheckOut || "");
        const nights =
          !isNaN(ci) && !isNaN(co)
            ? Math.max(0, (co - ci) / (1000 * 60 * 60 * 24))
            : 0;
        s.Nights = String(nights);
        const nEl = document.getElementById(`Nights_${idx}`);
        if (nEl) nEl.value = s.Nights;
      }

      function switchMode(mode) {
        currentMode = mode;
        renderSectorsFromState(); // re-render dynamic field; preserve values
        document.getElementById("template").innerHTML = ""; // clear preview
      }

      function formatDate(dateStr) {
        const date = new Date(dateStr);
        if (isNaN(date)) return "";
        const day = String(date.getDate()).padStart(2, "0");
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const year = String(date.getFullYear()).slice(-2);
        return `${day}/${month}/${year}`;
      }

      function collectGeneral() {
        const data = {};
        generalFields.forEach((f) => {
          const elRef = document.getElementById(f.key);
          data[f.label || f.key] = elRef ? elRef.value || "" : "";
        });
        return data;
      }

      function collectSectors() {
        return sectorsState.slice(); // copy from state
      }

      function generateTemplate() {
        const g = collectGeneral();
        const sectors = collectSectors();

        let rowsHTML = "";
        let totalPrice = 0;

        sectors.forEach((s) => {
          const qty = parseFloat(s.Qty || 0) || 0;
          const nights = parseFloat(s.Nights || 0) || 0;
          const pricePerNight =
            currentMode === "invoice" ? parseFloat(s.ConfOrPrice || 0) || 0 : 0;
          if (currentMode === "invoice")
            totalPrice += qty * nights * pricePerNight;

          rowsHTML += `
            <tr>
              <td>${s.Qty}</td>
              <td>${s.RoomType}</td>
              <td>${formatDate(s.CheckIn)}</td>
              <td>${formatDate(s.CheckOut)}</td>
              <td>${s.Nights}</td>
              <td>${s.ConfOrPrice}</td>
              <td>${s.View}</td>
              <td>${s.MealPlan}</td>
            </tr>`;
        });

        document.getElementById("template").innerHTML = `
          <div class="header">
            <div>
              <div class="medium-text"><strong>Date:</strong> ${formatDate(
                g["Date"] || ""
              )}</div>
              <div class="medium-text"><strong>To:</strong> ${
                g["To"] || ""
              }</div>
              <div class="medium-text"><strong>Att:</strong> ${
                g["Att"] || ""
              }</div>
            </div>
            <div style="text-align: center;">
              <img src="${logoBase64}" height="50" alt="Logo" />
              <div><strong>${companyName}</strong></div>
              <div class="small">${
                currentMode === "voucher" ? "Definite Confirmation" : "Invoice"
              }</div>
            </div>
          </div>
          <hr />
          <p class="medium-text">Thank you for considering ${companyNameSmall} as your travel partner.</p>
          <div class="grid">
            <div><strong>Res No:</strong> ${
              g["Res No"] || g["ResNo"] || ""
            }</div>
            <div><strong>Hotel Name:</strong> ${
              g["Hotel Name"] || g["HotelName"] || ""
            }</div>
            <div><strong>Guest Name:</strong> ${
              g["Guest Name"] || g["GuestName"] || ""
            }</div>
            <div><strong>Total PAX:</strong> ${
              g["Total Pax"] || g["TotalPax"] || ""
            }</div>
          </div>

          <div class="table-wrapper">
            <table class="table">
              <thead>
                <tr>
                  <th>QTY</th>
                  <th>Room Type</th>
                  <th>Checkin</th>
                  <th>Checkout</th>
                  <th>Nights</th>
                  <th>${
                    currentMode === "invoice" ? "Price/Night" : "Confirmation"
                  }</th>
                  <th>View</th>
                  <th>Meal Plan</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHTML}
              </tbody>
            </table>
          </div>

          ${
            currentMode === "invoice"
              ? `<div style="text-align:right; margin-top: 10px;"><strong>Total Price:</strong> SAR ${
                  isNaN(totalPrice) ? "N/A" : totalPrice.toFixed(2)
                }</div>`
              : ""
          }

          <div style="position: relative; height: 0; z-index: 0;">
            <img src="${logoBase64}" alt="Watermark Logo" style="position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 300px; opacity: 0.06; z-index: 0; pointer-events: none;" />
          </div>

          <div class="remarks"><strong>Remarks:</strong> ${
            g["Remarks"] || ""
          }</div>

          <ul class="pretty-remarks">
            <li>We hope the reservation is in accordance with your request.</li>
            ${
              currentMode === "invoice"
                ? "<li>Kindly make the payment by the option date to avoid automatic release of the reservation without any prior notice.</li>"
                : ""
            }
            <li>Any amendment to the booking is subject to availability.</li>
            ${
              currentMode === "invoice"
                ? "<li>Reservation can only be secured on a 100% confirmed basis through complete payment to avoid cancellation.</li>"
                : ""
            }
            <li>Cancellation Policy - The booking is non-refundable once confirmed on a definite basis.</li>
            ${
              currentMode === "voucher"
                ? "<li>Check-in after 16:00 hours and check-out at 12:00 hours.</li>"
                : ""
            }
          </ul>

          <div class="footer" style="margin-top: 30px;">
            <div>
              <strong>KSA HELPLINE:</strong><br />
              ${companyHelpline}
            </div>
            <div style="text-align: right;">
              <div><strong>Thanks & Regards</strong></div>
              <div>${SalesAgentName}</div>
              <div class="small"><strong>Phone:</strong> ${SalesAgentPhone}</div>
              <div class="small"><strong>Reservation Print Date:</strong> ${formatDate(
                new Date()
              )}</div>
            </div>
          </div>

          <div class="small" style="margin-top: 20px;">
            <strong>${companyName}</strong> - ${companyAddress}<br />
            📞 ${companyPhone} &nbsp; | &nbsp; ✉️ ${companyEmail} &nbsp; | &nbsp; 🌐 ${companyWebsite}
          </div>
        `;
      }

      function generateFileName() {
        const type = window.currentMode === "invoice" ? "Invoice" : "Voucher";

        const safe = (v) =>
          String(v || "")
            .normalize("NFKD") // split accents
            .replace(/[\u0300-\u036f]/g, "") // drop diacritics
            .replace(/[^\p{L}\p{N}\s\-_.]+/gu, "") // keep letters/numbers/space/-/._ (unicode letters)
            .trim()
            .replace(/\s+/g, "_");

        const resNo = safe(document.getElementById("ResNo")?.value);
        const guest = safe(document.getElementById("GuestName")?.value);
        const hotel = safe(document.getElementById("HotelName")?.value);

        // join and collapse extra separators
        let base = [type, resNo, guest, hotel].filter(Boolean).join("_");
        base = base.replace(/_+/g, "_").replace(/^_+|_+$/g, "");

        // fallback if empty
        if (!base) {
          const d = new Date();
          const ts = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(
            2,
            "0"
          )}${String(d.getDate()).padStart(2, "0")}_${String(
            d.getHours()
          ).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}`;
          base = `${type}_${ts}`;
        }

        // keep it reasonable for filesystems
        if (base.length > 120) base = base.slice(0, 120);

        return base;
      }

      function handlePrint() {
        const originalTitle = document.title;
        document.title = generateFileName();
        window.print();
        setTimeout(() => {
          document.title = originalTitle;
        }, 1000);
      }

      function exportToPDF() {
        const element = document.getElementById("template");
        html2pdf()
          .set({
            margin: 0,
            filename: `${generateFileName()}.pdf`,
            image: { type: "jpeg", quality: 1 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          })
          .from(element)
          .save();
      }

      // Initial render
      renderGeneral();
      resizeSectorsTo(1); // start with 1 sector
    </script>
  </body>
</html>
